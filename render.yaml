# Render.com 配置文件
# 访问 https://dashboard.render.com 并连接你的 GitHub 仓库

services:
  - type: web
    name: maitian-site
    env: python
    plan: free
    region: oregon  # 或 singapore（新加坡，离中国更近）
    startCommand: python3 maitian-all-in-one.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.9
